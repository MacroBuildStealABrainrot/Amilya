# Host-local administration only. Cloud Run runtime receives a distinct non-superuser role.
local all wcp_owner peer map=wcp_owner_map
local all all peer
# Observed source of authorized IAP SSH host forwarding is this VM's private IP.
# This is not a VPC-wide owner grant; TLS and the generated owner password are required.
hostssl woundcopilot wcp_owner 10.30.0.10/32 scram-sha-256
hostssl woundcopilot wcp_app 10.30.0.0/26 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::/0 reject
