# RUN ONCE. Makes the new signing key for the private Amilya test installer.
# The key is NEVER saved in the repository or its history. It is put in a one-day download that only you can open.
# You copy it into a repository SECRET (Settings > Secrets), then delete the download.
name: make-signing-key
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  make-key:
    runs-on: ubuntu-24.04
    env:
      SECRET_ALREADY_THERE: ${{ secrets.AMILYA_SIGNING_BUNDLE != '' }}
    steps:
      - name: Refuse to run unless this repository is PRIVATE
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [ "$(gh api repos/${{ github.repository }} --jq .private)" = "true" ] || { echo "::error::This repository is PUBLIC. Make it private first. Nothing was created."; exit 1; }
      - name: Stop if the signing secret already exists (a key is made only once)
        run: |
          [ "$SECRET_ALREADY_THERE" != "true" ] || { echo "::error::The secret AMILYA_SIGNING_BUNDLE already exists. Nothing was made."; exit 1; }
      - name: Make the key
        run: |
          set -euo pipefail
          mkdir -p out; PW="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/k.jks" -storetype PKCS12 -alias amilyaprivate -keyalg RSA -keysize 4096 \
            -validity 9125 -storepass "$PW" -keypass "$PW" -dname "CN=Amilya Private Test, O=Amilya test only" >/dev/null 2>&1
          FP="$(keytool -list -v -keystore "$RUNNER_TEMP/k.jks" -storepass "$PW" 2>/dev/null | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')"
          # One text file, three lines: password, fingerprint, the key (as text). You paste the whole file into ONE secret.
          { echo "$PW"; echo "$FP"; base64 -w0 "$RUNNER_TEMP/k.jks"; echo; } > out/AMILYA_SIGNING_BUNDLE.txt
          echo "::notice title=New key made::Fingerprint (safe to share): $FP"
      - uses: actions/upload-artifact@v4
        with:
          name: SIGNING-KEY-copy-into-secret-then-DELETE
          path: out/AMILYA_SIGNING_BUNDLE.txt
          retention-days: 1
