name: Notes screen-off recording

on:
  workflow_dispatch:
  push:
    branches: ['fix/notes-screen-*']

permissions:
  contents: read

concurrency:
  group: notes-screen-off-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android tools and emulator API
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          "$sdkmanager" --list > "$RUNNER_TEMP/sdk-packages.txt"
          if grep -Eq '^[[:space:]]*system-images;android-37;google_apis;x86_64[[:space:]]*\|' "$RUNNER_TEMP/sdk-packages.txt"; then
            echo 'api=37' >> "$GITHUB_OUTPUT"
          else
            echo 'api=35' >> "$GITHUB_OUTPUT"
          fi
          "$sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          sudo chmod a+rw /dev/kvm
      - name: Build Notes and its test with a disposable emulator certificate
        env:
          WCP_SIGN_KEYSTORE: ${{ runner.temp }}/notes-emulator.p12
          WCP_SIGN_STORE_PASSWORD: android
          WCP_SIGN_KEY_ALIAS: androiddebugkey
          WCP_SIGN_KEY_PASSWORD: android
        run: |
          keytool -genkeypair -storetype PKCS12 -keystore "$WCP_SIGN_KEYSTORE" -storepass android \
            -keypass android -alias androiddebugkey -dname 'CN=Disposable emulator test' -keyalg RSA -validity 1
          # Android signs test APKs with the debug key by default. Use this same ephemeral key for both.
          mkdir -p "$HOME/.android"
          cp "$WCP_SIGN_KEYSTORE" "$HOME/.android/debug.keystore"
          cd android
          bash gradlew --no-daemon -PwcpTestBuildType=notes :app:assembleNotes :app:assembleNotesAndroidTest
      - name: Prepare and verify the virtual ALSA microphone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends alsa-utils pulseaudio pulseaudio-utils
          python3 -m venv "$RUNNER_TEMP/notes-grpc"
          "$RUNNER_TEMP/notes-grpc/bin/pip" install --quiet grpcio-tools==1.71.0
          python3 ci/notes-virtual-microphone.py prepare
          ALSA_CONFIG_PATH="$RUNNER_TEMP/notes.asoundrc" arecord -q -D default -t raw -f S16_LE -r 48000 -c 1 -d 2 "$RUNNER_TEMP/alsa-check.raw"
          python3 ci/notes-virtual-microphone.py verify "$RUNNER_TEMP/alsa-check.raw"
      - name: Record with file-backed virtual microphone
        id: alsa
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ALSA_CONFIG_PATH: ${{ runner.temp }}/notes.asoundrc
          QEMU_AUDIO_DRV: alsa
          QEMU_ALSA_ADC_DEV: default
          QEMU_ALSA_DAC_DEV: "null"
        with:
          api-level: ${{ steps.sdk.outputs.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -allow-host-audio -http-proxy http://127.0.0.1:1
          script: bash ci/run-notes-screen-off.sh alsa
      - name: Prepare independent virtual audio source when ALSA cannot feed the guest
        if: steps.alsa.outcome == 'failure'
        run: |
          pulseaudio --check || pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=notes_fixture rate=48000
          pactl set-default-source notes_fixture.monitor
          pulse_url=$(pactl info | sed -n 's/^Server String: //p')
          test -S "${pulse_url#unix:}"
          echo "PULSE_SERVER=unix:${pulse_url#unix:}" >> "$GITHUB_ENV"
          echo "QEMU_PA_SERVER=unix:${pulse_url#unix:}" >> "$GITHUB_ENV"
      - name: Repeat full test with the SDK audio injector and a virtual audio backend
        if: steps.alsa.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          QEMU_AUDIO_DRV: pa
          PULSE_SOURCE: notes_fixture.monitor
          QEMU_PA_SOURCE: notes_fixture.monitor
        with:
          api-level: ${{ steps.sdk.outputs.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -grpc 8554 -grpc-use-token -http-proxy http://127.0.0.1:1
          script: bash ci/run-notes-screen-off.sh grpc
