# Photo-report 409 repair build; GitHub Actions trigger.
# Amilya / WoundCoPilot 1.8.5-test10: build and test on GitHub's machines (they have the Android SDK; the review workspace does not).
#
# SAFE BY DESIGN
#  * Uses NO secrets, NO signing keys, NO AI keys and NO network service of yours. Nothing is deployed. Production, Cloud Run,
#    clinical data and billing are never touched. No emulator is installed or run.
#    Android instrumentation is compiled for later physical Samsung validation.
#  * Put this in a PRIVATE repository. Run it from the Actions tab ("Run workflow") or by pushing.
#
# WHAT YOU GET (Actions run page > Artifacts):
#  * amilya-apks: app-sandbox.apk, app-debug.apk, app-release-unsigned.apk, wear-sandbox.apk
#  * amilya-build-evidence: Gradle unit-test reports, lint report, build-flag checks, backend test log (SQLite + PostgreSQL)
#  * Device execution is intentionally excluded at the owner's request.
name: amilya-sandbox-ci

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'test/**', 'fix/**', 'combined/**' ]

permissions:
  contents: read

concurrency:
  group: amilya-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend tests (SQLite + PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: wcp, POSTGRES_PASSWORD: wcp-ci-only, POSTGRES_DB: wcp_test }
        ports: [ "55432:5432" ]
        options: --health-cmd "pg_isready -U wcp" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore checksum-verified synthetic audio fixture
        run: python3 ci/restore-large-fixture.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ffmpeg and backend packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -r backend/requirements.txt
      - name: Backend test suite
        working-directory: backend
        env:
          WCP_TEST_POSTGRES_URL: postgresql+psycopg://wcp:wcp-ci-only@127.0.0.1:55432/wcp_test
        run: |
          mkdir -p ../ci-out
          python -m pytest -v -p no:cacheprovider 2>&1 | tee ../ci-out/backend-pytest.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Show failing test names
        if: failure()
        run: grep -E '^(FAILED|ERROR) ' ci-out/backend-pytest.log | head -20 | cut -c1-300 | sed 's/^/::error::/' || true
      - name: Static safety checks
        run: python -I verification/python_static_checks.py | tee ci-out/python-static-checks.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amilya-backend-evidence
          path: ci-out/
          retention-days: 30

  android:
    permissions:
      contents: read  # no release pages are created any more; downloads exist only as run artifacts
    name: Android build + unit tests + build-flag checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore checksum-verified synthetic audio fixture
        run: python3 ci/restore-large-fixture.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use preinstalled Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager is missing on this runner"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || test ${PIPESTATUS[1]} -eq 0
      - name: Android platform 36 and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all variants and run unit tests
        working-directory: android
        run: |
          set -euo pipefail
          # Fill only an isolated 1 MB RAM disk, never the runner's filesystem.
          WCP_STORAGE_FULL_TEST_DIR="$(mktemp -d /tmp/amilya-full-XXXXXX)"
          export WCP_STORAGE_FULL_TEST_DIR
          cleanup() {
            sudo umount "$WCP_STORAGE_FULL_TEST_DIR" 2>/dev/null || true
            rmdir "$WCP_STORAGE_FULL_TEST_DIR" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo mount -t tmpfs -o size=1m,mode=0777 tmpfs "$WCP_STORAGE_FULL_TEST_DIR"
          base64 -d ../ci/pilot-test.keystore.b64 > ../ci/pilot-test.keystore
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:test :wear-contract:test \
            :app:assembleSandbox :app:assemblePilot :app:assembleRepair :app:assembleRenderTest :app:assembleDebug :app:assembleRelease :app:assembleSandboxAndroidTest \
            :wear:assembleSandbox :wear:assembleRelease 2>&1 | tee ../gradle-build.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Lint (sandbox + pilot)
        working-directory: android
        run: ./gradlew --no-daemon :app:lintSandbox :app:lintPilot :app:lintRepair :app:lintRenderTest
      - name: Check build flags inside the built apps
        run: bash ci/verify-build-flags.sh | tee build-flags.log
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p ci-out/apks ci-out/reports
          find android -path '*/build/outputs/apk/*' -name '*.apk' -exec cp {} ci-out/apks/ \; || true
          cp -r android/app/build/reports ci-out/reports/app 2>/dev/null || true
          cp -r android/wear-contract/build/reports ci-out/reports/wear-contract 2>/dev/null || true
          cp gradle-build.log build-flags.log ci-out/ 2>/dev/null || true
          (cd ci-out/apks && sha256sum *.apk > SHA256SUMS.txt) || true
      - name: Prepare the one app to install
        if: always()
        run: |
          mkdir -p ci-out/install
          cp android/app/build/outputs/apk/pilot/*.apk ci-out/install/Amilya-Test-15.apk || true
          cp android/app/build/outputs/apk/repair/*.apk ci-out/install/Amilya-Server-Test.apk || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INSTALL-THIS-Amilya-Test-15
          path: ci-out/install/Amilya-Test-15.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amilya-apks
          path: "ci-out/apks/*.apk\nci-out/apks/SHA256SUMS.txt"
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amilya-build-evidence
          path: "ci-out/*.log\nci-out/reports/"
          retention-days: 30

  repair-automation-tests:
    name: Repair deployment safety tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install synthetic-check test dependencies
        run: python3 -m pip install httpx==0.28.1 Pillow==12.3.0
      - name: Test zero-traffic deployment and rollback controls
        run: python3 -m unittest discover -s ci/tests -v

  repair-deploy:
    name: Repair server deployment
    needs: [backend, android, repair-automation-tests]
    if: github.event_name == 'push' && github.repository == 'MacroBuildStealABrainrot/Amilya' && github.ref == 'refs/heads/fix/server-diagnosis-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: amilya-repair
    permissions:
      contents: read
      id-token: write
    # Never cancel a job while it could be restoring the service template.
    concurrency:
      group: amilya-repair-cloud
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject superseded commit before cloud authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api repos/MacroBuildStealABrainrot/Amilya/branches/fix/server-diagnosis-20261025 --jq .commit.sha)"
          test "$current" = "$GITHUB_SHA" || { echo "::error::Commit was superseded; no cloud deployment attempted."; exit 1; }
      - name: Check one-time connection configuration
        id: connection
        env:
          AMILYA_GCP_WIF_PROVIDER: ${{ vars.AMILYA_GCP_WIF_PROVIDER }}
          AMILYA_GCP_DEPLOY_ACCOUNT: ${{ vars.AMILYA_GCP_DEPLOY_ACCOUNT }}
          AMILYA_REPAIR_DEPLOY_ENABLED: ${{ vars.AMILYA_REPAIR_DEPLOY_ENABLED }}
          AMILYA_SMOKE_WORKSPACE_ID: ${{ vars.AMILYA_SMOKE_WORKSPACE_ID }}
          AMILYA_SMOKE_EMAIL: ${{ secrets.AMILYA_SMOKE_EMAIL }}
          AMILYA_SMOKE_PASSWORD: ${{ secrets.AMILYA_SMOKE_PASSWORD }}
        run: python3 ci/repair_connection.py
      - name: Authenticate with short-lived Google credentials
        id: cloud_auth
        if: steps.connection.outputs.ready == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.AMILYA_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.AMILYA_GCP_DEPLOY_ACCOUNT }}
          project_id: woundcopilot-20260905
          create_credentials_file: true
      - name: Set up Google Cloud CLI
        if: steps.connection.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: woundcopilot-20260905
      - name: Install synthetic-check dependencies
        if: steps.connection.outputs.ready == 'true'
        run: |
          python3 -m pip install httpx==0.28.1 Pillow==12.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          espeak-ng -w "$RUNNER_TEMP/amilya-synthetic.wav" "Synthetic software test only. Pain score is two out of ten. The dressing was changed."
      - name: Build pinned repair image, test candidate, update repair tag
        if: steps.connection.outputs.ready == 'true'
        env:
          AMILYA_SMOKE_EMAIL: ${{ secrets.AMILYA_SMOKE_EMAIL }}
          AMILYA_SMOKE_PASSWORD: ${{ secrets.AMILYA_SMOKE_PASSWORD }}
          AMILYA_SMOKE_WORKSPACE_ID: ${{ vars.AMILYA_SMOKE_WORKSPACE_ID }}
        run: |
          export AMILYA_SMOKE_AUDIO="$RUNNER_TEMP/amilya-synthetic.wav"
          python3 ci/repair_deploy.py --state "$RUNNER_TEMP/amilya-repair-private/state.json"
      - name: Recover template and previous repair tag if interrupted
        if: always() && steps.cloud_auth.outcome == 'success'
        run: python3 ci/repair_deploy.py --recover --state "$RUNNER_TEMP/amilya-repair-private/state.json"
      - name: Save connection status only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amilya-repair-connection
          path: repair-connection-status.json
          if-no-files-found: ignore
          retention-days: 7

